aid: uizard-technologies
name: Uizard Technologies
description: >-
  Uizard is an AI-powered UI design and prototyping platform that lets non-designers turn text
  prompts, screenshots, and hand-drawn sketches into editable mockups and multi-screen prototypes.
  Founded in Copenhagen out of the pix2code machine-learning research project, Uizard ships AI
  features including Autodesigner 2.0, Design Assistant, Screenshot Scanner, Wireframe Scanner, and
  Design Review, and joined Miro in May 2024 while continuing to operate as its own product. It was
  surfaced as a portfolio company of insight-partners. Uizard publishes no public developer portal,
  API documentation, or client SDKs, so this profile captures the company's real public web, legal,
  support, release-notes, and security surface plus its GitHub organization and first-party
  open-source tooling.
